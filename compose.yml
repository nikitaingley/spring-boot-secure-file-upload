name: cloud-storage
services:
  postgres:
    container_name: postgres-sql-cloud-storage
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: cloud-storage
    ports:
      - "5432:5432"
    restart: unless-stopped

  clamav:
    container_name: clamav-cloud-storage
    image: clamav/clamav
    platform: linux/amd64
    ports:
      - "3310:3310"
    restart: unless-stopped

  azurite:
    container_name: azurite-cloud-storage
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
    restart: unless-stopped

  rustfs:
    container_name: rustfs-cloud-storage
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

volumes:
  rustfs-data: