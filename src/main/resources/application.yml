spring:
  application:
    name: cloud-storage
  datasource:
    url: jdbc:postgresql://localhost:5432/cloud-storage
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      enabled: true
  cloud:
    aws:
      region:
        static: ${AWS_S3_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-ms: 3600000

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD}

cloud:
  azure:
    storage:
      blob:
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    s3:
      region: ${AWS_S3_REGION}
      bucket-name: ${AWS_S3_BUCKET_NAME}
  storage:
    provider: azure   # default cloud when the upload request doesn't choose one
    access-url-duration-minutes: 30
    aws:
      s3:
        bucket-name: ${AWS_S3_BUCKET_NAME}

clamav:
  host: localhost
  port: 3310

springdoc:
  api-docs:
    path: /api-docs/v3
  swagger-ui:
    path: /docs
    operations-sorter: method
    display-request-duration: true
  default-produces-media-type: application/json